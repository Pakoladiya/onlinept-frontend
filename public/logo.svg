<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#007AFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00C853;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon: stylized person in movement/therapy pose -->
  <g transform="translate(10, 20)">
    <!-- Head -->
    <circle cx="22" cy="10" r="9" fill="url(#grad1)"/>
    <!-- Body arc representing movement/recovery -->
    <path d="M22 20 Q22 40 10 55" stroke="url(#grad1)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Arm reaching out (therapeutic gesture) -->
    <path d="M22 28 Q35 30 48 22" stroke="url(#grad1)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Leg/lower body arc -->
    <path d="M10 55 Q5 65 12 75" stroke="url(#grad1)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Pulse line accent -->
    <path d="M55 30 L62 30 L67 20 L72 40 L77 30 L84 30" stroke="#007AFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  </g>

  <!-- Brand Name -->
  <text x="105" y="55" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1a1a2e">
    Online<tspan fill="url(#grad1)">PT</tspan>.in
  </text>

  <!-- Tagline -->
  <text x="107" y="78" font-family="Arial, sans-serif" font-size="11" fill="#666" letter-spacing="2">
    PHYSIOTHERAPY CONSULTATION
  </text>
</svg>